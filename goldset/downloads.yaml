# Goldset für den Korpus /home/speedy/Downloads (Stand 2026-11-07).
#
# Eigene deutsche Fragen, formuliert gegen den Inhalt der PDFs. Nur Dokumente in
# deutscher Sprache: die Fragen zu den beiden englischen Artikeln stehen in
# downloads-alle-sprachen.yaml. `quelle` ist ein
# eindeutiger Namensausschnitt, `seite` die Seitenzahl. Kein Fragensatz aus einer
# fremden Quelle, keine Übersetzung.
#
# `beantwortbar: false` heißt: der Korpus enthält die Antwort nicht. Richtig ist
# dort "keine Antwort", nicht "irgendeine Antwort".

fragen:
  - frage: Welche Rolle spielt das Model Context Protocol zwischen Sprachmodell und BI-System?
    beantwortbar: true
    erwartet:
      - { quelle: "Business Intelligence im KI-Zeitalter", seite: 5 }

  - frage: Warum verändert generative KI die Rolle des BI-Entwicklers?
    beantwortbar: true
