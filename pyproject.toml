[project]
name = "arbiterrag"
version = "0.1.0"
description = "RAG over a local corpus with hybrid retrieval, reranking and a logprob gate"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "lancedb>=0.39,<0.40",
    "pyarrow>=16",
    "numpy>=1.26",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pypdf>=5.0",
    "pypdfium2>=5.15.0",
    "pillow>=13.0.0",
    "fastapi>=0.162.1",
    "uvicorn[standard]>=0.54.0",
    "textual>=0.86",
]

[project.scripts]
arbiter = "arbiter.cli:main"
arbiter-api = "arbiter.api:main"
arbiter-tui = "arbiter.tui:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12.20261103",
    "pytest-asyncio>=1.4.1.post1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arbiter"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: needs the real llama-swap/Laya endpoints (excluded by default)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["lancedb.*", "pyarrow.*"]
ignore_missing_imports = true
